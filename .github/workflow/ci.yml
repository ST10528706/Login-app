name: Java CI with Ant
on:
  Push:
    branches:[ "master"]
  pull_request:
    branches:[ "master"]
jobs:
  build
    runs-on: ubuntu-latest
    steps:
      uses: actions/checkout@v4
      name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
      name: Build and test with Ant
      run: ant test
